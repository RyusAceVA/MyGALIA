name: mygalia
description: "MyGalia — alternative moderne à SC-Form (Material 3 Expressive)."
publish_to: "none"

# Version applicative (SemVer + build number après le +)
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# ---------------------------------------------------------------------------
# Dépendances runtime
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Textes Material en français (sélecteur de date…)
    sdk: flutter

  # --- Gestion d'état (Riverpod, providers manuels) ------------------------
  flutter_riverpod: ^2.6.1 # Conteneur d'état / injection de dépendances

  # --- Réseau --------------------------------------------------------------
  dio: ^5.7.0 # Client HTTP (intercepteurs, retry, gestion tokens)
  html: ^0.15.7 # Parseur HTML5 (pages WebForms du planning et des notes)
  connectivity_plus: ^7.3.2 # Détection du retour du réseau (rechargement auto)

  # --- Stockage ------------------------------------------------------------
  flutter_secure_storage: ^9.2.2 # Secrets sensibles (tokens, credentials)
  hive: ^2.2.3 # Base clé/valeur locale rapide (cache)
  hive_flutter: ^1.1.0 # Intégration Hive <-> Flutter (init, path)

  # --- UI / Design ---------------------------------------------------------

# ---------------------------------------------------------------------------
# Dépendances de développement (codegen, lint, tests)
# ---------------------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Analyse statique
  flutter_lints: ^5.0.0

  # --- Codegen & lints Riverpod/Hive (désactivés pour l'instant) -----------
  # On utilise des providers Riverpod MANUELS (pas d'annotations @riverpod) et
  # aucun TypeAdapter Hive pour l'instant, donc pas besoin de build_runner.
  # hive_generator épingle un vieil `analyzer` incompatible avec Dart 3.12,
  # ce qui casse la résolution ; on les réintroduira avec des versions
  # compatibles le jour où la génération de code sera réellement nécessaire :
  #   build_runner, riverpod_generator, hive_generator,
  #   custom_lint, riverpod_lint

# ---------------------------------------------------------------------------
# Configuration Flutter
# ---------------------------------------------------------------------------
flutter:
  uses-material-design: true

  # Polices embarquées (licence OFL, voir assets/fonts/OFL-*.txt) : aucun
  # téléchargement au lancement, même rendu hors ligne.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
